<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo list</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./src/app.mjs"></script>
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <p class="app__eyebrow">A little more organized</p>
        <h1>My tasks</h1>
      </header>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">New task</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="What needs doing?"
          autocomplete="off"
          required
        >
        <button class="button button--primary" type="submit">Add task</button>
      </form>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="task-section" aria-labelledby="task-list-heading">
        <h2 class="sr-only" id="task-list-heading">Your task list</h2>
        <ul class="task-list" id="task-list"></ul>
      </section>
    </main>
  </body>
</html>
